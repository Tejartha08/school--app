<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - EduTrack Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md">
    <div class="text-center mb-6">
      <span class="text-4xl">🎓</span>
      <h1 class="text-2xl font-bold text-gray-800 mt-2">Create Account</h1>
      <p class="text-sm text-gray-500">Register to access school management features</p>
    </div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
        <input 
          type="text" 
          id="signupName" 
          required 
          placeholder="e.g. John Doe"
          class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
        <input 
          type="email" 
          id="signupEmail" 
          required 
          placeholder="Enter any email address"
          class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
        <input 
          type="password" 
          id="signupPassword" 
          required 
          placeholder="Enter any password"
          class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Account Role</label>
        <select 
          id="signupRole" 
          class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800"
        >
          <option value="STUDENT">Student</option>
          <option value="TEACHER">Teacher</option>
          <option value="PARENT">Parent</option>
          <option value="ADMIN">Administrator</option>
        </select>
      </div>

      <button 
        type="submit" 
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition-all"
      >
        Register & Create Account
      </button>
    </form>

    <div class="text-center mt-6 text-sm text-gray-600">
      Already have an account? <a href="login.html" class="text-indigo-600 font-semibold hover:underline">Sign In</a>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
