<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Parent Dashboard - Oak Tree School</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b px-8 py-4 flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold text-emerald-800">🌳 Oak Tree School - Parent Portal</h1>
    <button onclick="localStorage.clear(); window.location.href='login.html';" class="text-sm bg-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300">Sign Out</button>
  </header>
  <main class="p-8 max-w-7xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Parent Dashboard</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">Linked Child Progress</h3>
        <p class="text-lg font-bold text-gray-800 mt-2">Grade 10 - Section A</p>
        <span class="inline-block mt-2 px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">Good Academic Standing</span>
      </div>
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">Recent Notifications</h3>
        <p class="text-sm text-gray-600 mt-2">📢 Parent-Teacher Conference scheduled for Friday at 3 PM.</p>
      </div>
    </div>
  </main>
</body>
</html>
