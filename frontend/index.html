  <style>
    /* Liquid Glass UI */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 0.75rem;
      color: #94a3b8;
      transition: all 0.15s;
    }
    .sidebar-link:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }
    .sidebar-link.active {
      background-color: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen selection:bg-indigo-500 selection:text-white font-sans">

  <!-- ==================== JAVASCRIPT SYSTEM ==================== -->
  <script>
    const API_BASE_URL = 'http://127.0.0.1:8000';
    let currentUserRole = 'ADMIN';

    // Shared storage for homework assignments
    if (!localStorage.getItem('erp_homework_list')) {
      const defaultHomework = [
        { id: 1, title: 'Physics: Wave Optics Lab Report', teacher: 'Dr. Sarah Jenkins', dueDate: 'August 18, 2026', status: 'Pending Review' },
        { id: 2, title: 'Calculus Worksheet Chapter 4', teacher: 'Mrs. Clara Barton', dueDate: 'August 15, 2026', status: 'Completed (Grade: A+)' }
      ];
      localStorage.setItem('erp_homework_list', JSON.stringify(defaultHomework));
    }

    // Shared storage for teacher exam alerts
    if (!localStorage.getItem('erp_exam_alerts')) {
      const defaultExams = [
        { id: 1, title: 'Term 1 Midterm Exam', subject: 'Physics 101', date: 'August 22, 2026', teacher: 'Dr. Sarah Jenkins', status: 'Scheduled' },
        { id: 2, title: 'FA-1 Assessment Test', subject: 'Advanced Mathematics', date: 'August 28, 2026', teacher: 'Mrs. Clara Barton', status: 'Upcoming' }
      ];
      localStorage.setItem('erp_exam_alerts', JSON.stringify(defaultExams));
    }

    lucide.createIcons();

    // Video Fade Handler
    const video = document.getElementById('bgVideo');
    let fadeAnimId = null;
    let isFadingOut = false;

    function cancelRunningAnimation() {
      if (fadeAnimId !== null) {
        cancelAnimationFrame(fadeAnimId);
        fadeAnimId = null;
      }
    }

    function fadeVideo(targetOpacity, duration, onComplete) {
      cancelRunningAnimation();
      const startOpacity = parseFloat(video.style.opacity || '0');
      const opacityDiff = targetOpacity - startOpacity;

      if (Math.abs(opacityDiff) < 0.001) {
        video.style.opacity = targetOpacity;
        if (onComplete) onComplete();
        return;
      }

      let startTime = null;

      function animateStep(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        video.style.opacity = startOpacity + opacityDiff * progress;

        if (progress < 1) {
          fadeAnimId = requestAnimationFrame(animateStep);
        } else {
          video.style.opacity = targetOpacity;
          fadeAnimId = null;
          if (onComplete) onComplete();
        }
      }

      fadeAnimId = requestAnimationFrame(animateStep);
    }

    if (video) {
      video.addEventListener('loadeddata', () => fadeVideo(1, 500));
      video.addEventListener('timeupdate', () => {
        if (!video.duration || isNaN(video.duration)) return;
        const timeRemaining = video.duration - video.currentTime;
        if (timeRemaining <= 0.55 && !isFadingOut) {
          isFadingOut = true;
          fadeVideo(0, 500);
        }
      });
      video.addEventListener('ended', () => {
        cancelRunningAnimation();
        video.style.opacity = '0';
        setTimeout(() => {
          video.currentTime = 0;
          isFadingOut = false;
          video.play().catch(() => {});
          fadeVideo(1, 500);
        }, 100);
      });
    }

    function openAuthModal(tab = 'login') {
      document.getElementById('authModal').classList.remove('hidden');
      switchAuthTab(tab);
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }

    function switchAuthTab(tab) {
      const loginSec = document.getElementById('loginSection');
      const signupSec = document.getElementById('signupSection');
      const loginTabBtn = document.getElementById('loginTabBtn');
      const signupTabBtn = document.getElementById('signupTabBtn');

      if (tab === 'login') {
        loginSec.classList.remove('hidden');
        signupSec.classList.add('hidden');
        loginTabBtn.className = 'flex-1 py-2 font-semibold text-center text-indigo-400 border-b-2 border-indigo-500';
        signupTabBtn.className = 'flex-1 py-2 font-semibold text-center text-gray-400 border-b-2 border-transparent';
      } else {
        loginSec.classList.add('hidden');
        signupSec.classList.remove('hidden');
        signupTabBtn.className = 'flex-1 py-2 font-semibold text-center text-indigo-400 border-b-2 border-indigo-500';
        loginTabBtn.className = 'flex-1 py-2 font-semibold text-center text-gray-400 border-b-2 border-transparent';
      }
    }

    async function executeSignUp() {
      const name = document.getElementById('signupName').value.trim() || 'User';
      const role = document.getElementById('signupRole').value || 'ADMIN';

      localStorage.setItem('erp_user', name);
      localStorage.setItem('erp_role', role);
      localStorage.setItem('erp_token', 'active-session');

      closeAuthModal();
      loadERPDashboard();
    }

    async function executeLogin() {
      const email = document.getElementById('loginEmail').value.trim() || 'Adith';
      const role = document.getElementById('loginRole').value || 'ADMIN';
      const userName = email.includes('@') ? email.split('@')[0] : email;

      localStorage.setItem('erp_user', userName);
      localStorage.setItem('erp_role', role);
      localStorage.setItem('erp_token', 'active-session');

      closeAuthModal();
      loadERPDashboard();
    }

    function handleSignOut() {
      localStorage.clear();
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('landingView').classList.remove('hidden');
    }

    function loadERPDashboard() {
      currentUserRole = localStorage.getItem('erp_role') || 'ADMIN';
      const user = localStorage.getItem('erp_user') || 'User';

      document.getElementById('landingView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');

      document.getElementById('userNameDisplay').innerText = `Welcome Back, ${user}`;
      document.getElementById('roleBadge').innerText = `${currentUserRole} DASHBOARD`;

      buildSidebar(currentUserRole);
    }

    // Dynamic Navigation Builder
    function buildSidebar(role) {
      const menu = document.getElementById('sidebarMenu');
      let links = [];

      if (role === 'ADMIN') {
        links = [
          { key: 'dashboard', label: 'Dashboard Overview', icon: 'layout-dashboard' },
          { key: 'students_grade', label: 'Grade-Wise Students', icon: 'users' },
          { key: 'student_info_search', label: 'Student Information Search', icon: 'search' },
          { key: 'teachers', label: 'Teachers Directory', icon: 'user-check' },
          { key: 'teacher_attendance', label: 'Teacher Attendance Tracking', icon: 'calendar-check' },
          { key: 'admin_fees_grade', label: 'Grade-Wise Fees & Revenue', icon: 'credit-card' },
          { key: 'exams_reports', label: 'Exams & Teacher Alerts', icon: 'file-spreadsheet' }
        ];
      } else if (role === 'TEACHER') {
        links = [
          { key: 'dashboard', label: 'Teacher Overview', icon: 'layout-dashboard' },
          { key: 'assigned_classes', label: 'Assigned Classes & Timings', icon: 'clock' },
          { key: 'attendance_select', label: 'Class Attendance Register', icon: 'calendar-check' },
          { key: 'marks_grades', label: 'Marks & Student Gradebook', icon: 'file-text' },
          { key: 'teacher_reports', label: 'Reports & Student Performance', icon: 'line-chart' },
          { key: 'fa_sa_cards', label: 'FA/SA & Annual Report Cards', icon: 'award' },
          { key: 'homework_assign', label: 'Assign Homework & Alerts', icon: 'briefcase' }
        ];
      } else if (role === 'PARENT') {
        links = [
          { key: 'dashboard', label: 'Child Overview', icon: 'layout-dashboard' },
          { key: 'parent_performance', label: 'Reports & Student Performance', icon: 'activity' },
          { key: 'term_fees', label: 'Term-Wise Fees & Payments', icon: 'credit-card' },
          { key: 'fa_sa_parent', label: 'FA, SA & Annual Report Cards', icon: 'award' },
          { key: 'homework_projects', label: 'Homework & Projects', icon: 'briefcase' }
        ];
      } else { // STUDENT - Homework Removed
        links = [
          { key: 'dashboard', label: 'Student Overview', icon: 'layout-dashboard' },
          { key: 'subject_courses', label: 'Subject Courses', icon: 'book-open' },
          { key: 'fa_sa_parent', label: 'My Report Card & Grades', icon: 'award' }
        ];
      }

      menu.innerHTML = links.map(link => `
        <button onclick="renderView('${link.key}')" id="nav_${link.key}" class="sidebar-link w-full text-left">
          <i data-lucide="${link.icon}" class="w-4 h-4"></i>
          <span>${link.label}</span>
        </button>
      `).join('');

      lucide.createIcons();
      renderView('dashboard');
    }

    // Canvas Engine
    function renderView(viewKey) {
      document.querySelectorAll('.sidebar-link').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`nav_${viewKey}`);
      if (activeBtn) activeBtn.classList.add('active');

      const canvas = document.getElementById('mainCanvas');
      const user = localStorage.getItem('erp_user') || 'User';

      // 1. OVERVIEW SCREENS
      if (viewKey === 'dashboard') {
        if (currentUserRole === 'STUDENT') {
          canvas.innerHTML = `
            <div class="mb-6">
              <h2 class="text-2xl font-bold text-white">Welcome Back, ${user} 👋</h2>
              <p class="text-xs text-slate-400 mt-1">Student Progress & Learning Portal</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between shadow-xl">
                <div><p class="text-xs text-slate-400 font-bold uppercase">Academic Attendance</p><p class="text-3xl font-extrabold text-emerald-400 mt-1">96.5%</p></div>
                <div class="p-3 bg-emerald-500/20 text-emerald-400 rounded-xl"><i data-lucide="user-check" class="w-6 h-6"></i></div>
              </div>
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between shadow-xl">
                <div><p class="text-xs text-slate-400 font-bold uppercase">Enrolled Subjects</p><p class="text-3xl font-extrabold text-indigo-400 mt-1">6 Courses</p></div>
                <div class="p-3 bg-indigo-500/20 text-indigo-400 rounded-xl"><i data-lucide="book-open" class="w-6 h-6"></i></div>
              </div>
            </div>
          `;
        } else if (currentUserRole === 'TEACHER') {
          canvas.innerHTML = `
            <div class="mb-6">
              <h2 class="text-2xl font-bold text-white">Welcome Back, ${user} 👋</h2>
              <p class="text-xs text-slate-400 mt-1">Faculty Instruction Panel (Grade 5 to Grade 10)</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between shadow-xl">
                <div><p class="text-xs text-slate-400 font-bold uppercase">Assigned Classes</p><p class="text-3xl font-extrabold text-white mt-1">6 Active Sections</p></div>
                <div class="p-3 bg-indigo-500/20 text-indigo-400 rounded-xl"><i data-lucide="users" class="w-6 h-6"></i></div>
              </div>
              <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex items-center justify-between shadow-xl">

              <h2 class="text-2xl font-bold text-white">Welcome Back, ${user} 👋</h2>
              <p class="text-xs text-slate-400 mt-1">Parent Overview for Marcus Jenkins (Grade 10-A)</p>

    // Post handlers
    function postTeacherHomework() {
      const title = document.getElementById('hwTitleInput').value || 'New Assignment Task';
      const dueDate = document.getElementById('hwDueInput').value || 'August 28, 2026';
      const teacher = localStorage.getItem('erp_user') || 'Dr. Sarah Jenkins';

      const homeworkList = JSON.parse(localStorage.getItem('erp_homework_list') || '[]');
      homeworkList.unshift({ id: Date.now(), title, teacher, dueDate, status: 'Pending Review' });
      localStorage.setItem('erp_homework_list', JSON.stringify(homeworkList));

      alert('Homework posted! Synchronized on Parent and Student dashboards.');
      renderView('homework_assign');
    }

    function postTeacherExamAlert() {
      const title = document.getElementById('examTitleInput').value || 'Midterm Assessment';
      const date = document.getElementById('examDateInput').value || 'September 15, 2026';
      const teacher = localStorage.getItem('erp_user') || 'Dr. Sarah Jenkins';

      const examAlerts = JSON.parse(localStorage.getItem('erp_exam_alerts') || '[]');
      examAlerts.unshift({ id: Date.now(), title, subject: 'Physics & Science', date, teacher, status: 'Scheduled' });
      localStorage.setItem('erp_exam_alerts', JSON.stringify(examAlerts));

      alert('Exam alert posted! Updated in Admin Exams & Reports section.');
      renderView('homework_assign');
    }

    if (localStorage.getItem('erp_token')) {
      loadERPDashboard();
