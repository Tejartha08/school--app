<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard - Oak Tree School</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b px-8 py-4 flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold text-emerald-800">🌳 Oak Tree School - Administration Portal</h1>
    <button onclick="localStorage.clear(); window.location.href='login.html';" class="text-sm bg-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300">Sign Out</button>
  </header>
  <main class="p-8 max-w-7xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">System Administration Dashboard</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">Total Active Users</h3>
        <p class="text-4xl font-extrabold text-blue-600 mt-2">1,420</p>
      </div>
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">System Revenue</h3>
        <p class="text-4xl font-extrabold text-emerald-600 mt-2">$24.2k</p>
      </div>
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">Active Classes</h3>
        <p class="text-4xl font-extrabold text-purple-600 mt-2">48</p>
      </div>
    </div>
  </main>
</body>
</html>
