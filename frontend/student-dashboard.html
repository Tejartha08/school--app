<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Dashboard - Oak Tree School</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
  <header class="bg-white border-b px-8 py-4 flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold text-emerald-800">🌳 Oak Tree School - Student Portal</h1>
    <button onclick="localStorage.clear(); window.location.href='login.html';" class="text-sm bg-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300">Sign Out</button>
  </header>
  <main class="p-8 max-w-7xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Student Dashboard</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">Attendance Rate</h3>
        <p class="text-4xl font-extrabold text-emerald-600 mt-2">95%</p>
      </div>
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">Active Assignments</h3>
        <p class="text-4xl font-extrabold text-indigo-600 mt-2">3 Pending</p>
      </div>
      <div class="bg-white p-6 rounded-xl border shadow-sm">
        <h3 class="text-gray-500 text-sm font-semibold">GPA</h3>
        <p class="text-4xl font-extrabold text-amber-500 mt-2">3.8 / 4.0</p>
      </div>
    </div>
  </main>
</body>
</html>
